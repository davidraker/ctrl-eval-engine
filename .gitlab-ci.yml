stages:
  - build
  - promote

variables:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 413400106021.dkr.ecr.us-west-2.amazonaws.com
  IMAGE_REPO: ctrl-eval-engine
  IMAGE_URI: ${ECR_REGISTRY}/${IMAGE_REPO}

build_test_push:
  stage: build
  tags:
    - aws
    - instance
  script:
    - docker build -t "${IMAGE_URI}:${CI_COMMIT_BRANCH}" .
    - docker run --rm "${IMAGE_URI}:${CI_COMMIT_BRANCH}" julia --project=. -e 'using Pkg; Pkg.test()'
    - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
    - docker push "${IMAGE_URI}:${CI_COMMIT_BRANCH}"
  rules:
    - if: $CI_COMMIT_BRANCH == 'development'

retag:
  stage: promote
  tags:
    - aws
    - instance
  script:
    - |
      set -eu
      aws ecr batch-get-image \
        --region "${AWS_REGION}" \
        --repository-name "${IMAGE_REPO}" \
        --image-ids imageTag="${SRC_TAG}" \
        --query 'images[0].imageManifest' \
        --output text > image-manifest.json
      manifest=$(cat image-manifest.json)
      if [ -z "${manifest}" ] || [ "${manifest}" = "None" ]; then
        echo "ECR tag ${SRC_TAG} was not found in ${IMAGE_REPO}" >&2
        exit 1
      fi
      # put-image rejects a tag that already exists, including on a mutable repository.
      aws ecr batch-delete-image \
        --region "${AWS_REGION}" \
        --repository-name "${IMAGE_REPO}" \
        --image-ids imageTag="${DST_TAG}" || true
      aws ecr put-image \
        --region "${AWS_REGION}" \
        --repository-name "${IMAGE_REPO}" \
        --image-tag "${DST_TAG}" \
        --image-manifest file://image-manifest.json
  rules:
    - if: $CI_COMMIT_BRANCH == 'staging'
      variables:
        SRC_TAG: development
        DST_TAG: staging
    - if: $CI_COMMIT_BRANCH == 'main'
      variables:
        SRC_TAG: staging
        DST_TAG: main
